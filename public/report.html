<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Compliance report &middot; EPC2C</title>
<meta name="description" content="Your EPC2C compliance report."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0f1e33;--navy2:#162843;--teal:#4ecba8;--teald:#2fa882;--tealp:rgba(78,203,168,.1);--tealbdr:rgba(78,203,168,.22);
  --warm:#f5f2ec;--char:#1a2332;--body:#374151;--muted:#6b7280;--rule:#e8e4dc;--white:#ffffff;
  --amber:#d97706;--amberp:#fffbeb;--green:#059669;--greenp:#ecfdf5;--red:#dc2626;--redp:#fef2f2;
  --serif:'Fraunces',Georgia,serif;--sans:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--white);color:var(--body);font-size:15px;line-height:1.6}
nav{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(15,30,51,.96);backdrop-filter:blur(14px);border-bottom:0.5px solid rgba(255,255,255,.07)}
.nav-inner{max-width:1100px;margin:0 auto;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:58px}
.logo{font-family:var(--serif);font-size:20px;font-weight:400;color:var(--white);text-decoration:none;letter-spacing:-.02em}
.logo-num{color:var(--teal)}.logo-c{font-style:italic;font-weight:300}
.nav-links{display:flex;align-items:center;gap:22px}
.nav-link{font-size:13px;color:rgba(255,255,255,.45);text-decoration:none;transition:color .2s}
.nav-link:hover{color:var(--white)}
.nav-cta{font-size:13px;font-weight:500;background:var(--teal);color:var(--navy);padding:7px 16px;border-radius:6px;text-decoration:none}

.page-hero{background:var(--navy);padding:104px 2rem 48px;text-align:center}
.page-eyebrow{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin-bottom:14px}
.page-h{font-family:var(--serif);font-size:36px;font-weight:300;color:var(--white);line-height:1.15;margin-bottom:10px}
.page-sub{font-size:14px;color:rgba(255,255,255,.5);max-width:560px;margin:0 auto;line-height:1.7}

.content{max-width:720px;margin:0 auto;padding:44px 2rem 64px}

.summary{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--white);border:0.5px solid var(--rule);border-radius:14px;padding:20px 22px;margin-bottom:14px}
.summary-addr{font-family:var(--serif);font-size:19px;color:var(--char);font-weight:400}
.summary-meta{font-size:13px;color:var(--muted);margin-top:3px}
.summary-right{display:flex;align-items:center;gap:14px}
.band{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:9px;font-weight:600;font-size:20px;color:#fff}
.band-a{background:#0b8a3c}.band-b{background:#2fa343}.band-c{background:#8dce46;color:#274d00}.band-d{background:#f1c40f;color:#5a4b00}.band-e{background:#f39c12}.band-f{background:#e8702a}.band-g{background:#d0021b}.band-x{background:#9aa3ad}
.pay{font-size:11.5px;font-weight:500;padding:5px 11px;border-radius:20px}
.pay-paid{background:var(--greenp);color:var(--green)}
.pay-unpaid{background:var(--tealp);color:var(--teald)}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 26px}
.btn-primary{font-family:var(--sans);font-size:13px;font-weight:500;background:var(--teal);color:var(--navy);border:none;border-radius:7px;padding:11px 20px;cursor:pointer;text-decoration:none;display:inline-block;transition:background .2s}
.btn-primary:hover{background:var(--teald)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{font-family:var(--sans);font-size:13px;font-weight:500;background:transparent;color:var(--muted);border:0.5px solid var(--rule);border-radius:7px;padding:11px 20px;cursor:pointer;text-decoration:none;display:inline-block;transition:all .2s}
.btn-secondary:hover{background:var(--warm);color:var(--char)}

.rep-section{background:var(--white);border:0.5px solid var(--rule);border-radius:14px;padding:22px 24px;margin-bottom:14px}
.rep-section h2{font-family:var(--serif);font-size:18px;font-weight:400;color:var(--char);margin-bottom:14px}
.muted{color:var(--muted);font-size:14px}
.kv-group{display:flex;flex-direction:column;gap:9px}
.kv{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:start;font-size:14px;padding-bottom:9px;border-bottom:0.5px solid var(--rule)}
.kv:last-child{border-bottom:none;padding-bottom:0}
.kv-k{color:var(--muted);font-weight:500}
.kv-v{color:var(--char);word-break:break-word}
.rv-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.rv-list>li{padding:10px 12px;background:var(--warm);border-radius:8px;font-size:14px;color:var(--char)}
.rv-list .kv{grid-template-columns:170px 1fr}
.raw{margin-top:14px}
.raw summary{font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
.raw summary:hover{color:var(--char)}
.raw pre{margin-top:8px;background:var(--navy);color:#cfe8df;font-family:var(--mono);font-size:12px;line-height:1.55;padding:14px;border-radius:8px;overflow:auto;max-height:340px}

.state{max-width:520px;margin:0 auto;padding:60px 2rem;text-align:center}
.state h2{font-family:var(--serif);font-size:24px;font-weight:300;color:var(--char);margin-bottom:10px}
.state p{font-size:14px;color:var(--muted);margin-bottom:18px;line-height:1.7}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;color:var(--muted);padding:60px 0}
.spinner{width:14px;height:14px;border:2px solid var(--rule);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

footer{background:var(--navy2);border-top:0.5px solid rgba(255,255,255,.06);padding:28px 2rem;margin-top:24px}
.foot-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.foot-logo{font-family:var(--serif);font-size:16px;font-weight:300;color:rgba(255,255,255,.32)}
.foot-logo span{color:var(--teal)}
.foot-links{display:flex;gap:14px;flex-wrap:wrap}
.foot-link{font-size:12px;color:rgba(255,255,255,.25);text-decoration:none}
.foot-link:hover{color:rgba(255,255,255,.5)}
.foot-copy{font-size:12px;color:rgba(255,255,255,.18)}
@media(max-width:768px){.nav-links{display:none}.page-h{font-size:27px}.kv{grid-template-columns:1fr}.foot-inner{flex-direction:column;text-align:center}}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/" class="logo">EPC<span class="logo-num">2</span><span class="logo-c">C</span></a>
    <div class="nav-links">
      <a href="/dashboard" class="nav-link">Dashboard</a>
      <a href="/epc-c-calculator" class="nav-cta">Check your property</a>
    </div>
  </div>
</nav>

<div class="page-hero">
  <div class="page-eyebrow">Compliance report</div>
  <h1 class="page-h" id="hero-title">Your report</h1>
  <p class="page-sub" id="hero-sub">Loading&hellip;</p>
</div>

<div id="main">
  <div class="loading"><span class="spinner"></span><span>Loading your report&hellip;</span></div>
</div>

<footer>
  <div class="foot-inner">
    <div class="foot-logo">EPC<span>2C</span> &middot; GoGreen Alliance Ltd</div>
    <div class="foot-links">
      <a href="/" class="foot-link">Home</a>
      <a href="/dashboard" class="foot-link">Dashboard</a>
      <a href="/privacy" class="foot-link">Privacy</a>
      <a href="/terms" class="foot-link">Terms</a>
      <a href="/methodology" class="foot-link">Methodology</a>
    </div>
    <div class="foot-copy">&copy; 2025 EPC2C &middot; Powered by GoGreen Alliance Ltd</div>
  </div>
</footer>

<script type="module">
  import { supabase } from '/js/supabase-client.js';

  const main     = document.getElementById('main');
  const heroTitle = document.getElementById('hero-title');
  const heroSub   = document.getElementById('hero-sub');

  // ── helpers ───────────────────────────────────────────────────────────────
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const fmtDate = d => { try { return new Date(d).toLocaleDateString('en-GB',
    { day:'numeric', month:'long', year:'numeric' }); } catch { return ''; } };
  const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
  const humanize = k => String(k).replace(/[_-]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

  function bandOf(epc) {
    if (!epc || typeof epc !== 'object') return null;
    const v = epc['current-energy-rating'] ?? epc.currentEnergyRating
            ?? epc.current_energy_rating ?? epc['current-energy-band'];
    return v ? String(v).trim().toUpperCase().charAt(0) : null;
  }
  function bandChip(b) {
    const cls = b && 'ABCDEFG'.includes(b) ? 'band-' + b.toLowerCase() : 'band-x';
    return `<span class="band ${cls}" title="EPC band">${b || '?'}</span>`;
  }

  // Render any JSON value into readable HTML (handles unknown report shapes).
  function renderValue(v) {
    if (v == null || v === '') return '<span class="muted">&mdash;</span>';
    if (Array.isArray(v)) {
      if (!v.length) return '<span class="muted">&mdash;</span>';
      return '<ul class="rv-list">' +
        v.map(it => '<li>' + (isObj(it) ? renderObj(it) : esc(String(it))) + '</li>').join('') +
        '</ul>';
    }
    if (isObj(v)) return renderObj(v);
    return esc(String(v));
  }
  function renderObj(o) {
    const rows = Object.entries(o).map(([k, val]) =>
      `<div class="kv"><div class="kv-k">${esc(humanize(k))}</div><div class="kv-v">${renderValue(val)}</div></div>`
    ).join('');
    return `<div class="kv-group">${rows}</div>`;
  }
  function isEmpty(d) {
    return d == null
        || (Array.isArray(d) && !d.length)
        || (isObj(d) && !Object.keys(d).length);
  }
  function section(title, data) {
    const body = isEmpty(data)
      ? '<p class="muted">Not included in this report.</p>'
      : renderValue(data) +
        `<details class="raw"><summary>Raw data</summary><pre>${esc(JSON.stringify(data, null, 2))}</pre></details>`;
    return `<div class="rep-section"><h2>${esc(title)}</h2>${body}</div>`;
  }

  function showState(title, msg, ctaHref, ctaText) {
    heroSub.textContent = '';
    main.innerHTML = `<div class="state">
        <h2>${esc(title)}</h2>
        <p>${esc(msg)}</p>
        ${ctaHref ? `<a class="btn-primary" href="${ctaHref}">${esc(ctaText)}</a>` : ''}
      </div>`;
  }

  // ── load ─────────────────────────────────────────────────────────────────
  (async () => {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) { window.location.href = '/login'; return; }

    // Report id from /report/<id> (falls back to ?id= for safety).
    const parts = window.location.pathname.split('/').filter(Boolean);
    const id = (parts[0] === 'report' && parts[1]) ? parts[1]
             : new URLSearchParams(location.search).get('id');
    if (!id) { showState('No report selected', 'No report id was provided.', '/dashboard', 'Go to dashboard'); return; }

    // RLS ensures a user can only read reports tied to their own properties;
    // anyone else's id simply returns no row.
    const { data: report, error } = await supabase
      .from('reports')
      .select('*, property:properties(*)')
      .eq('id', id)
      .maybeSingle();

    if (error) { showState('Something went wrong', error.message, '/dashboard', 'Go to dashboard'); return; }
    if (!report) {
      showState('Report not found',
        'This report does not exist, or it belongs to another account.',
        '/dashboard', 'Go to dashboard');
      return;
    }

    const prop = report.property || {};
    const band = bandOf(prop.epc_data_json);
    const paid = report.payment_status === 'paid';

    heroTitle.textContent = prop.address || 'Your compliance report';
    heroSub.textContent = `Generated ${fmtDate(report.created_at)}`;

    const pdfBtn = report.pdf_url
      ? `<a class="btn-primary" href="${esc(report.pdf_url)}" target="_blank" rel="noopener">Download PDF</a>`
      : `<button class="btn-primary" disabled title="No PDF attached to this report">PDF not available</button>`;

    main.innerHTML = `
      <div class="content">
        <div class="summary">
          <div>
            <div class="summary-addr">${esc(prop.address || 'Unknown address')}</div>
            <div class="summary-meta">${esc(prop.postcode || '')}${prop.epc_rrn ? ' &middot; EPC ' + esc(prop.epc_rrn) : ''}</div>
          </div>
          <div class="summary-right">
            <span class="pay ${paid ? 'pay-paid' : 'pay-unpaid'}">${paid ? 'Paid' : 'Draft'}</span>
            ${bandChip(band)}
          </div>
        </div>

        <div class="actions">
          ${pdfBtn}
          <a class="btn-secondary" href="/dashboard">&larr; Back to dashboard</a>
        </div>

        ${section('Selected measures', report.selected_measures_json)}
        ${section('Pathway results',   report.pathway_results_json)}
        ${section('Exemption results', report.exemption_results_json)}
      </div>`;
  })().catch(e => showState('Something went wrong', e.message, '/dashboard', 'Go to dashboard'));
</script>
</body>
</html>
